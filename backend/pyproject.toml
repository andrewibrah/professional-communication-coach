[project]
name = "speechclear-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "openai>=1.68,<3",
    "python-multipart>=0.0.20",
    "pytest>=8,<10",
    "websockets>=15,<17",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
